<!doctype html>

<!-- Especificación del idioma -->
<html lang="es-ES">

  <head>
    <!-- Metadatos -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />

    <!-- Autor/Descripción -->
    <meta name="author" content="Efrén García Valencia" />
    <meta
      name="description"
      content="Formulario del trabajo PEC 2 de la asignatura de HTML y CSS II"
    />

    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="./assets/styles/main.scss" />

    <!-- Título -->
    <title>Inicio</title>
  </head>

  <body>

    <!-- COMPONENTE BOOTSTRAP: uso de forms -->
    <!-- COMPONENTE BOOTSTRAP: uso de button -->

    <!-- Cabecera -->
    <include src="./views/header.html"></include>

    <main>

      <div class="o-container text-center">
        <h1 class="u-text__background">Formulario</h1>
      </div>

      <div class="o-container o-container--reduced text-center">
        <p>¿Tienes algún proyecto que pueda ayudar a mejorar la vida del municipio?</p>
        <p>No lo pienses más, ¡inscríbete!</p>
      </div>

      <form class="o-container o-container--reduced c-userform" method="POST" data-netlify="true">
        
        <!-- Nombre -->
        <div class="mb-3">
          <label class="c-userform__label form-label" for="nombre">Nombre</label>
          <input class="form-control" id="nombre" type="text" placeholder="Nombre">
        </div>

        <!-- Primer apellido -->
        <div class="mb-3">
          <label class="c-userform__label form-label" for="primerApellido">Primer apellido</label>
          <input class="form-control" id="primerApellido" type="text" placeholder="Primer apellido">
        </div>

        <!-- Segundo apellido -->
        <div class="mb-3">
          <label class="c-userform__label form-label" for="segundoApellido">Segundo apellido</label>
          <input class="form-control" id="segundoApellido" type="text" placeholder="Segundo apellido">
        </div>

        <!-- Correo electrónico -->
        <div class="mb-3">
          <label class="c-userform__label form-label" for="correoElectronico">Correo electrónico</label>
          <input class="form-control" id="correoElectronico" type="email" placeholder="correo@gmail.com" aria-describedby="correoElectronicoHelp">
          <div class="c-userform__help form-text" id="correoElectronicoHelp">Recibirá una notificación en su correo electrónico con más detalles para participar.</div>
        </div>

        <!-- Motivo de la participación -->
        <div class="mb-3">
          <label class="c-userform__label form-label" for="motivo">Motivo de la participación</label>
          <input class="form-control" id="motivo" type="text" placeholder="Motivo" aria-describedby="motivoHelp">
          <div class="c-userform__help form-text" id="motivoHelp">Indique en mayor detalle los motivos por los que está interesado en participar.</div>
        </div>

        <!-- Envío del formulario -->
        <div class="text-center">
          <button class="c-userform__button btn btn-primary" type="submit">Enviar formulario</button>
        </div>
      </form>

    </main>

    <!-- Pie de página -->
    <include src="./views/footer.html"></include>

    <!-- Línea adicional que el boilerplate dice que no hay que borrar -->
    <script type="module" src="./assets/scripts/main.js"></script>
  </body>
</html>
