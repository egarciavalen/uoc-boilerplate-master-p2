<!doctype html>

<!-- Especificación del idioma -->
<html lang="es-ES">

  <head>
    <!-- Metadatos -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />

    <!-- Autor/Descripción -->
    <meta name="author" content="Efrén García Valencia" />
    <meta
      name="description"
      content="Formulario del trabajo PEC 2 de la asignatura de HTML y CSS II"
    />

    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="./assets/styles/main.scss" />

    <!-- Título -->
    <title>Inicio</title>
  </head>

  <body>

    <!-- Cabecera -->
    <include src="./views/header.html"></include>

    <main>

      <h1>Formulario</h1>
      <p></p>

      <form>
        
        <!-- Nombre -->
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Nombre" aria-describedby="nombreHelp">
          <div id="emailHelp">Nombre del participante</div>
        </div>

        <!-- Primer apellido -->
        <div>
          <label for="primerApellido">Primer apellido</label>
          <input type="text" id="primerApellido" placeholder="Primer apellido" aria-describedby="primerApellidoHelp">
          <div id="primerApellidoHelp">Primer apellido del participante</div>
        </div>

        <!-- Segundo apellido -->
        <div>
          <label for="segundoApellido">Segundo apellido</label>
          <input type="text" id="segundoApellido" placeholder="Segundo apellido" aria-describedby="segundoApellidoHelp">
          <div id="segundoApellidoHelp">Segundo apellido del participante</div>
        </div>

        <!-- Correo electrónico -->
        <div>
          <label for="correoElectronico">Correo electrónico</label>
          <input type="email" id="correoElectronico" aria-describedby="correoElectronicoHelp">
          <div id="correoElectronicoHelp">Recibirá una notificación en su correo electrónico con más detalles para participar.</div>
        </div>

        <!-- Motivo de la participación -->
        <div>
          <label for="motivo">Motivo de la participación</label>
          <input type="text" id="motivo" aria-describedby="motivoHelp">
          <div id="motivoHelp">Indique en mayor detalle los motivos por los que está interesado en participar.</div>
        </div>

        <!-- Envío del formulario -->
        <button type="submit">Enviar formulario</button>
      </form>

    </main>

    <!-- Pie de página -->
    <include src="./views/footer.html"></include>

    <!-- Línea adicional que el boilerplate dice que no hay que borrar -->
    <script type="module" src="./assets/scripts/main.js"></script>
  </body>
</html>
